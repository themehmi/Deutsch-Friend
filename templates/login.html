<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log In - Deutsch Friend</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-color: #0d1117;
            --text-main: #c9d1d9;
            --primary: #58a6ff;
            --card-bg: #161b22;
            --card-border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .logo span {
            color: var(--primary);
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #fff;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background: #1f6feb;
        }

        .flash-messages {
            margin-bottom: 1rem;
        }

        .flash {
            color: #ff7b72;
            background: rgba(255, 123, 114, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .link {
            margin-top: 2.6rem;
            display: block;
            color: var(--primary);
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .back-link {
            margin-top: 2rem;
            display: block;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.2rem !important;
            }
        }
    
        /* iOS Zoom Fix */
        input, textarea, select {
            font-size: 16px !important;
        }
</style>

</head>

<body>

    <div class="form-container">
        <a href="/" class="logo">Deutsch<span>Friend</span></a>
        <h1>Log In</h1>

        <div class="flash-messages">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="flash">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Log In</button>
        </form>

        <a href="/signup" class="link">Don't have an account? Sign up</a>
    </div>

    <a href="/" class="back-link">← Back to Homepage</a>

</body>
</html>
